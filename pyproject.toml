[build-system]
# torch must match the runtime range below: build isolation resolves this list on its
# own, and a mismatch links the C++ extensions against the wrong libtorch.
# setuptools floor: 77 is the first release that understands the PEP 639 `license`
# SPDX string and `license-files` below.
requires = [
    "setuptools>=77",
    # Keep the build requirement in lock-step with the runtime requirement.  The
    # Windows ROCm wheel line currently uses Torch 2.12; the Linux/CUDA and
    # Linux ROCm 7/10 lines use Torch 2.11.
    "torch>=2.11,<2.12; platform_system != 'Windows'",
    "torch>=2.12,<2.13; platform_system == 'Windows'",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "freetoken"
# Single source of truth: python/freetoken/version.py (read via the attr directive below).
dynamic = ["version"]
description = "Local MoE-offload LLM inference runtime with OpenAI- and Anthropic-compatible APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "FlashML Team" }]
# No License:: classifier: setuptools>=77 rejects mixing one with the SPDX string above.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: AMD ROCm",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Version ranges are floor=last-verified, ceiling=next-major (kept loose enough to
# resolve, tight enough to bar a silent breaking bump). These ranges are the contract;
# there is no lockfile.
dependencies = [
    "apache-tvm-ffi==0.1.13.post3", # pin it
    "einops>=0.8,<1",
    "fastapi>=0.115,<1",
    # slot_cache: the device-side LRU admission kernel behind the MoE expert cache.
    "flashlib==0.3.0", # pin it
    "gguf>=0.19,<1",
    "huggingface_hub>=1.5,<2",
    "msgpack>=1.1,<2",
    "modelscope>=1.37,<2",
    # ceiling: numba (via flashlib) needs numpy<2.5
    "numpy>=2.0,<2.5",
    "openai>=2.0,<3",
    "partial-json-parser>=0.2,<1",
    "prompt_toolkit>=3.0,<4",
    "pydantic>=2.9,<3",
    "pyzmq>=27,<28",
    "safetensors>=0.6,<1",
    # Linux/CUDA and Linux ROCm 7/10 builds use Torch 2.11. Windows ROCm builds
    # use the independently published Torch 2.12 device wheel. The installer
    # supplies the vendor index; the markers keep a plain metadata resolve from
    # selecting an incompatible cross-platform build.
    "torch>=2.11,<2.12; platform_system != 'Windows'",
    "torch>=2.12,<2.13; platform_system == 'Windows'",
    "tqdm>=4.66,<5",
    "transformers>=5.5,<6",
    "triton==3.6.0; platform_system == 'Linux'",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/FlashML-org/FreeToken"
Repository = "https://github.com/FlashML-org/FreeToken"
Issues = "https://github.com/FlashML-org/FreeToken/issues"

[project.scripts]
ft = "freetoken.cli:main"

[project.optional-dependencies]
dev = ["pytest>=6.0"]
# Native fused-kernel packages. Without them the runtime falls back to the pure-Triton
# kernels in freetoken.kernel.triton (and the 'triton' attention backend). Install
# `freetoken[accel]` for the full native fast path.
fi = ["flashinfer-python[cu13]>=0.6,<0.7"]
# renamed from sgl-kernel at 0.4; still imports as `sgl_kernel`, so never co-install both
sgl = ["sglang-kernel==0.4.5"]
cuda = ["freetoken[fi,sgl]"]
# The ROCm Torch/device wheels are intentionally not pulled from PyPI.  Use
# scripts/install-rocm.sh (or the documented vendor index command) so the
# selected ROCm channel and GFX architecture are kept together.  Repeating the
# Torch range here makes `Provides-Extra: rocm` useful to resolvers while the
# installer controls wheel provenance.
rocm = [
    "torch>=2.11,<2.12; platform_system == 'Linux'",
    "torch>=2.12,<2.13; platform_system == 'Windows'",
]
# Backwards-compatible spelling used by existing CUDA installations.
accel = ["freetoken[cuda]"]
# NOTE: the Marlin W4A16 NVFP4 expert-GEMM path (sm_80-99) borrows vLLM's AOT wheel
# (vllm>=0.14,<0.15), which pins transformers>=4.56,<5 and so is INCOMPATIBLE with the
# core transformers>=5.5 requirement. It is therefore not a lockable extra and is left
# out of the default resolution — install it separately (`pip install 'vllm>=0.14,<0.15'`)
# in a dedicated environment when you specifically need the Marlin path.

# uv-only provenance pin for the optional CUDA sglang wheel.  Torch is intentionally
# not pinned to a CUDA index here: a ROCm install must be able to resolve its vendor
# Torch/device artifact through the selected channel.  The CUDA PyPI lane still
# resolves the same Torch 2.11 wheel used by the previous configuration.
[tool.uv.sources]
sglang-kernel = { index = "sglang-cu130" }

[[tool.uv.index]]
name = "sglang-cu130"
url = "https://docs.sglang.io/whl/cu130"
explicit = true

[tool.setuptools]
include-package-data = true
package-dir = {"" = "python"}

[tool.setuptools.dynamic]
version = {attr = "freetoken.version.__version__"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"*" = ["csrc/**/*", "moe/configs/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: takes tens of seconds (big kernel sweeps, real-checkpoint reads); deselect with -m 'not slow'",
    "needs_weights: needs a real local checkpoint, gated behind an env var (see tests/README.md)",
]
